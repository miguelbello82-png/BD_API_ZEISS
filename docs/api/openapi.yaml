openapi: 3.1.0
info:
  title: BD_API_ZEISS Serving API
  version: 1.0.0
  description: |
    API canônica oficial da plataforma independente BD_API_ZEISS.
    Permite consumo externo seguro, autenticado, isolado por loja e auditado de dados sincronizados da ZEISS.
    
    ### Princípios de Governança e Arquitetura:
    1. **Isolamento Absoluto por Loja:** Todas as consultas por loja (`/stores/{store_id}/...`) filtram estritamente pelo `store_id` autorizado no token/chave do consumidor. Zero vazamento interlojas.
    2. **Segregação Histórica:** Registros pré-multi-loja (`store_id IS NULL`) permanecem intocados e são acessíveis exclusivamente via `/admin/unassigned-orders` com escopo `admin:historical:read`.
    3. **Proteção de Mutações Externas:** Mutações ZEISS (VCH-002, VCH-003) exigem chave de idempotência (`Idempotency-Key`) no cabeçalho e chave de proteção operacional de runtime (`ALLOW_EXTERNAL_MUTATIONS=true`).
    4. **Privacidade e Minimização:** Dados sensíveis de leads são pseudonimizados com HMAC-SHA256 (`email_hmac`).
    
    ### Classificação de Status dos Endpoints
    - `[STATUS: OPERACIONAL]`: Implementado, validado com testes automatizados e apto para tráfego homologado com dados locais sincronizados.
    - `[STATUS: IMPLEMENTADO_NAO_HOMOLOGADO]`: Código e rotas implementados; pendente credenciais de produção ZEISS ou homologação de massa comercial ativa.
    - `[STATUS: PLANEJADO]`: Contrato desenhado no roadmap da plataforma; retorno HTTP 501 Not Implemented.

servers:
  - url: https://bdapizeissapi-production.up.railway.app/api/v1
    description: Servidor de Produção Oficial (Railway BD_API_ZEISS_API)
  - url: http://localhost:3000/api/v1
    description: Servidor Local de Desenvolvimento e Testes

paths:
  /health:
    get:
      summary: Health Check do Serviço
      description: Retorna a integridade do runtime da Serving API. Acesso público sem autenticação.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Infraestrutura
      responses:
        "200":
          description: Serviço operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /stores/{store_id}/orders:
    get:
      summary: Listar Pedidos da Loja
      description: |
        Retorna lista paginada de pedidos pertencentes estritamente à loja informada.
        Isolamento absoluto: registros históricos não atribuídos (`store_id IS NULL`) ou de outras lojas nunca são retornados.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Pedidos
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          description: UUID interno da loja
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          required: false
          description: Filtro por status do pedido
          schema:
            type: string
        - name: os_number
          in: query
          required: false
          description: Filtro por número de ordem de serviço
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          description: Data inicial de entrada (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: Data final de entrada (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista de pedidos da loja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersListResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /stores/{store_id}/orders/{order_number}:
    get:
      summary: Detalhes do Pedido da Loja
      description: Retorna os dados operacionais consolidados e detalhamento fiscal do pedido para a loja.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Pedidos
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: order_number
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalhes do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /stores/{store_id}/tracking/{nf_number}:
    get:
      summary: Rastreamento Logístico por NF
      description: Retorna o histórico de eventos de rastreamento DRIVIN da nota fiscal para a loja solicitada.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Rastreamento
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nf_number
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eventos de rastreamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /stores/{store_id}/campaigns:
    get:
      summary: Listar Campanhas Vigentes
      description: Retorna as campanhas ativas e elegíveis para a unidade de atendimento.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Campanhas
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de campanhas ativas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignsResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /stores/{store_id}/campaigns/{campaign_id}:
    get:
      summary: Detalhes da Campanha
      description: Retorna informações cadastrais de uma campanha específica na loja.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Campanhas
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalhes da campanha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetailResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /stores/{store_id}/campaigns/{campaign_id}/leads:
    get:
      summary: Listar Leads da Campanha na Loja
      description: Retorna leads associados à campanha e loja solicitadas com email pseudonimizado (HMAC-SHA256).
      tags:
        - "[STATUS: OPERACIONAL]"
        - Leads
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lista de leads da campanha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadsResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /stores/{store_id}/leads/{voucher_code}:
    get:
      summary: Obter Lead por Código de Voucher
      description: Retorna o lead e o vínculo com a campanha e loja correspondentes.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Leads
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: voucher_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados do lead associado ao voucher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDetailResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /stores/{store_id}/vouchers/{voucher_code}:
    get:
      summary: Consulta On-Demand de Voucher (VCH-001)
      description: |
        Recupera detalhes do voucher na base local ou via fallback em tempo real na API ZEISS (VCH-001).
      tags:
        - "[STATUS: OPERACIONAL]"
        - Vouchers
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: voucher_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalhes do voucher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherDetailResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /stores/{store_id}/vouchers/activate:
    post:
      summary: Ativação/Resgate de Voucher (VCH-003 Mutativo)
      description: |
        Executa a mutação VCH-003 na API ZEISS com chave de idempotência obrigatória.
        Exige `ALLOW_EXTERNAL_MUTATIONS=true` na configuração de runtime.
        Em caso de reenvio com a mesma chave e payload idêntico, o resultado anterior é reproduzido sem disparar nova mutação.
      tags:
        - "[STATUS: OPERACIONAL_MUTACAO_CONTROLADA]"
        - Vouchers
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única de idempotência gerada pelo cliente consumidor
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherActivationRequest'
      responses:
        "200":
          description: Voucher ativado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherActivationResponse'
        "400":
          description: Requisição inválida ou ausência do header Idempotency-Key
        "403":
          description: Mutações desabilitadas (`MUTATION_DISABLED`) ou permissão insuficiente
        "409":
          description: Conflito de idempotência (payload divergente ou processamento em andamento)

  /stores/{store_id}/vouchers/generate:
    post:
      summary: Geração de Vouchers ZEISS (VCH-002 Mutativo)
      description: |
        Emissão de novo voucher através da mutação VCH-002.
        Exige `ALLOW_EXTERNAL_MUTATIONS=true` e cabeçalho `Idempotency-Key`.
      tags:
        - "[STATUS: OPERACIONAL_MUTACAO_CONTROLADA]"
        - Vouchers
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherGenerateRequest'
      responses:
        "200":
          description: Voucher gerado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherGenerateResponse'
        "400":
          description: Payload inválido ou cabeçalho Idempotency-Key ausente
        "403":
          description: Mutações desabilitadas (`MUTATION_DISABLED`) ou escopo insuficiente
        "409":
          description: Conflito de idempotência

  /products:
    get:
      summary: Catálogo Global de Produtos ZEISS
      description: Retorna o catálogo unificado de produtos e lentes sincronizado na plataforma.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Catálogo
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          description: Categoria do produto (ex: monofocal, multifocal)
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Busca textual por nome ou código
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: Filtrar por produtos ativos ('true' / 'false')
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Lista paginada de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsListResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /products/{product_code}:
    get:
      summary: Detalhes do Produto
      description: Retorna a ficha técnica e dados consolidados do produto.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Catálogo
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: product_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalhes do produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /products/{product_code}/services:
    get:
      summary: Tratamentos e Serviços do Produto
      description: Retorna tratamentos (antirreflexo, colorações, adicionais) compatíveis com o produto.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Catálogo
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: product_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Serviços e tratamentos compatíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServicesResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /stores/{store_id}/financial/receivables:
    get:
      summary: Contas a Receber / Faturas da Loja
      description: Retorna a posição financeira e títulos/duplicatas sincronizados para a loja.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Financeiro
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Status do título (aberto, pago, vencido)
          schema:
            type: string
        - name: start_due_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_due_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Lista de títulos a receber
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivablesListResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /stores/{store_id}/financial/boletos/{boleto_id}:
    get:
      summary: Recuperação Transitória de Boleto (FIN-002)
      description: Consulta transitória de segunda via de boleto na ZEISS em tempo de atendimento.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Financeiro
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: boleto_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados para visualização do boleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoDetailResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /stores/{store_id}/financial/danfe/{nf_number}:
    get:
      summary: Recuperação Transitória de DANFE/XML (FIN-003)
      description: Consulta transitória de documento fiscal na ZEISS.
      tags:
        - "[STATUS: OPERACIONAL]"
        - Financeiro
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nf_number
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados ou link do documento fiscal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DanfeDetailResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /admin/unassigned-orders:
    get:
      summary: Listar Pedidos Históricos Não Atribuídos (Administrativo)
      description: |
        Endpoint segregado exclusivo para administradores de conciliação.
        Exige o escopo 'admin:historical:read'.
        Retorna exclusivamente pedidos onde `store_id IS NULL` (base histórica pré-multi-loja).
      tags:
        - "[STATUS: OPERACIONAL]"
        - Administração
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Pedidos históricos não atribuídos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignedOrdersResponse'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /admin/stores/onboard:
    post:
      summary: Cadastro de Nova Loja (Zero-Deploy)
      description: Criação administrativa de organização, loja e identidade ZEISS sem necessidade de deploy.
      tags:
        - "[STATUS: IMPLEMENTADO_NAO_HOMOLOGADO]"
        - Administração
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRegistrationRequest'
      responses:
        "201":
          description: Loja cadastrada em status 'draft' ou 'ready'

  /admin/stores/{store_id}/bootstrap:
    post:
      summary: Disparo de Bootstrap Histórico de Loja
      description: Dispara importação histórica de pedidos, tracking, financeiro e campanhas para uma nova loja.
      tags:
        - "[STATUS: IMPLEMENTADO_NAO_HOMOLOGADO]"
        - Administração
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Bootstrap iniciado ou retomado com sucesso

  /stores/{store_id}/vouchers/2fa/confirm:
    post:
      summary: Confirmação de PIN/Token 2FA para Voucher
      description: Validação de segundo fator de autenticação para resgate de vouchers restritos.
      tags:
        - "[STATUS: PLANEJADO]"
        - Vouchers 2FA
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "501":
          description: Funcionalidade planejada no roadmap

  /stores/{store_id}/vouchers/2fa/resend:
    post:
      summary: Reenvio de E-mail de Validação 2FA
      description: Solicitação de novo código 2FA ao consumidor final.
      tags:
        - "[STATUS: PLANEJADO]"
        - Vouchers 2FA
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "501":
          description: Funcionalidade planejada no roadmap

  /stores/{store_id}/sales/assisted:
    post:
      summary: Registro de Venda Assistida ZEISS
      description: Integração de fluxos assistidos de vendas no ecossistema ZEISS.
      tags:
        - "[STATUS: PLANEJADO]"
        - Vendas
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "501":
          description: Funcionalidade planejada no roadmap

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Token secreto de consumidor gerado pela plataforma
    BearerAuth:
      type: http
      scheme: bearer
      description: Token Bearer equivalente ao X-API-Key

  responses:
    UnauthorizedError:
      description: Não autorizado — Token ausente, inválido, expirado ou revogado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    ForbiddenError:
      description: Acesso negado — Escopo insuficiente ou tentativa de acesso cruzado entre lojas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFoundError:
      description: Recurso não localizado para os identificadores fornecidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'

  schemas:
    StandardError:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
